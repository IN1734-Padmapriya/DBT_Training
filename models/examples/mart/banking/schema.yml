version: 2
models:
  - name: dim_accounts
    description: "Dimension table containing one record for each bank account."
    columns:
      - name: account_sk
        description: "Surrogate key for the account, generated using MD5 of the account ID."
        tests:
          - unique
          - not_null
      - name: account_id
        description: "Natural key that uniquely identifies the bank account."

      - name: account_type
        description: "Type of bank account, such as savings or checking."

      - name: balance
        description: "Current balance of the bank account."

      - name: status
        description: "Current status of the bank account, such as Active or Dormant."

      - name: open_date
        description: "Date on which the bank account was opened."

      - name: created_at
        description: "Timestamp when the account record was initially created."

      - name: updated_at
        description: "Timestamp when the account record was last updated."

      - name: hash_key
        description: "Hash value generated from account attributes to identify changes in the account record."
  - name: fact_transactions
    description: "Fact table containing bank transaction records."
    columns:
      - name: transaction_id
        description: "Unique identifier for the bank transaction."
        tests:
          - unique
          - not_null
      - name: txn_sk
        description: "Surrogate key for the transaction, generated using MD5 of the transaction ID." 
      - name: transaction_type
        description: "Type of transaction, such as deposit, withdraw, payment, or transfer."
        tests:
          - accepted_values:
              values: ["deposit", "withdraw", "payment", "transfer"]
              config: 
                severity: warn
      - name: transaction_date
        description: "Date on which the transaction occurred."

      - name: amount
        description: "Monetary amount associated with the transaction."
      - name: account_sk
        description: "Surrogate key identifying the account associated with the transaction."
        tests:
          - relationships:
              to: ref('dim_accounts')
              field: account_sk
              
          

  
        
